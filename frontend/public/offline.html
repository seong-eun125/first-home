<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2F5D50" />
<title>FIRST HOME · 연결 끊김</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f5f6f4;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1f2a26; word-break: keep-all; }
  .card { max-width: 320px; margin: 24px; padding: 28px 24px; background: #fff; border-radius: 20px; text-align: center; box-shadow: 0 4px 20px rgba(31,42,38,.08); }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: #2F5D50; display: inline-flex; align-items: center; justify-content: center; }
  h1 { font-size: 18px; margin: 16px 0 6px; } p { font-size: 14px; color: #5f6b66; line-height: 1.6; margin: 0; }
  button { margin-top: 18px; border: 0; border-radius: 12px; background: #2F5D50; color: #fff; padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <span class="logo"><svg viewBox="0 0 32 32" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M6 15.5 16 7l10 8.5V25a1.5 1.5 0 0 1-1.5 1.5h-5.5v-7h-6v7H7.5A1.5 1.5 0 0 1 6 25z"/></svg></span>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요. 현장 체크에 입력한 내용은 연결되면 다시 저장해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
